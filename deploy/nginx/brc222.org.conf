# brc222.org static vhost — estate pattern (no listen IP:443; breaks SNI).
# Canonical host: apex (brc222.org). www → 301 https://brc222.org
#
# Install:
#   sudo bash deploy/scripts/apply-nginx-and-tls.sh

server {
    listen 80;
    listen [::]:80;
    listen 216.238.91.120:80;
    server_name www.brc222.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/brc222.org;
        try_files $uri =404;
    }

    location / {
        return 301 https://brc222.org$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 216.238.91.120:80;
    server_name brc222.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/brc222.org;
        try_files $uri =404;
    }

    location / {
        return 301 https://brc222.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.brc222.org;

    ssl_certificate     /etc/letsencrypt/live/brc222.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brc222.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://brc222.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brc222.org;

    root /var/www/brc222.org;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/brc222.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brc222.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location = /schema {
        default_type application/ld+json;
        alias /var/www/brc222.org/schema.json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
