# brc222.org — HTTP bootstrap for certbot (before TLS cert exists)
# Canonical host: apex. www → 301 http://brc222.org during bootstrap.
#
# listen 216.238.91.120:80 required — ip-preview-themetalayer binds that IP.

server {
    listen 80;
    listen [::]:80;
    listen 216.238.91.120:80;
    server_name www.brc222.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/brc222.org;
        try_files $uri =404;
    }

    location / {
        return 301 http://brc222.org$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 216.238.91.120:80;
    server_name brc222.org;

    root /var/www/brc222.org;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/brc222.org;
        try_files $uri =404;
    }

    location = /schema {
        default_type application/ld+json;
        alias /var/www/brc222.org/schema.json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
